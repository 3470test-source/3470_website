<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3470 Healthcare & Medical Coding Training Institute | College Placement Form</title>

    <!-- Favicon -->
    <link rel="icon" href="picture/Logo3470-health3 (2).jpg" type="image/x-icon">
    
    <link rel="stylesheet" href="styles.css" />

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet"/>

    <style>
        
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:'Times New Roman', Times, serif;
      background: #f3f7f5;
      color: #1f2937;
    }

    </style>

</head>
<body>


        <!-- College Placement Form  -->
        <div class="placement-page">

            <div class="placement-container">

                <!-- ================= Left : LOGO ================= -->
                <div class="placement-logo-section">

                    <div class="clg-left-logo-content">

                        <img src="picture/Logo3470-health3-removebg-preview.png" alt="Company Logo" class="clg-left-company-logo">
                        <h2>3470 Healthcare</h2>
                        <p>College Placement & Recruitment</p>

                        <div class="logo-line"></div>

                        <span>Start your professional journey with us.</span>

                    </div>

                </div>


                <!-- ================= Right : FORM ================= -->
                <div class="placement-rigt-form-section">

                    <div class="right-form-header">
                        <h1>College Placement Form</h1>
                        <p>Please complete the form below to apply for a job opportunity.</p>
                    </div>

                    <form id="placementForm">

                        <!-- Student / Applicant Details -->
                        <div class="plac-right-form-section">

                            <div class="plac-right-section-title">
                                <i class="fa-solid fa-user"></i><span>Applicant Details</span>
                            </div>

                                <div class="plac-right-form-grid">

                                    <!-- Full Name -->
                                    <div class="right-clg-form-group">
                                        <label for="fullName">Full Name <span>*</span></label>

                                    <div class="clg-input-box"><i class="fa-solid fa-user"></i>
                                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                                    </div>

                                </div>

                                    <!-- Email -->
                                    <div class="right-clg-form-group">
                                        <label for="email">Email ID <span>*</span></label>

                                        <div class="clg-input-box"><i class="fa-solid fa-envelope"></i>
                                            <input type="email" id="email" name="email" placeholder="Enter your email ID" required>
                                        </div>
                                    </div>

                                    <!-- Mobile -->
                                    <div class="right-clg-form-group">
                                        <label for="mobile">Mobile No <span>*</span></label>

                                        <div class="clg-input-box"><i class="fa-solid fa-phone"></i>
                                            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" maxlength="10"
                                            required>
                                        </div>
                                    </div>

                                    <!-- Posting -->
                                    <div class="right-clg-form-group">
                                        <label for="posting">Select Posting to Apply <span>*</span></label>

                                        <div class="clg-input-box"><i class="fa-solid fa-briefcase"></i>
                                            <select id="posting" name="posting" required>
                                                <option value="">-- Select Posting --</option>
                                                <option value="HR cum Admin">HR cum Admin</option>
                                                <option value="Admin">Admin</option>
                                                <option value="Tele calling">Tele calling</option>
                                            </select>
                                        </div>
                                    </div>

                            </div>

                        </div>


                <!-- ADDRESS -->
                <div class="plac-right-form-section">

                    <div class="plac-right-section-title"><i class="fa-solid fa-location-dot"></i>
                        <span>Address Details</span>
                    </div>

                <!-- Address -->
                <div class="right-clg-form-group right-clg-full-width">
                    <label for="address">Address <span>*</span></label>

                    <div class="clg-input-box textarea-box"><i class="fa-solid fa-house"></i>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your address" required></textarea>
                    </div>

                </div>


                <div class="plac-right-form-grid">

                    <!-- City -->
                    <div class="right-clg-form-group clg-city">
                        <label for="city">City <span>*</span></label>

                        <div class="clg-input-box"><i class="fa-solid fa-city"></i>
                            <input type="text" id="city" name="city" placeholder="Enter city" required>
                        </div>

                    </div>

                    <!-- State -->
                    <div class="right-clg-form-group clg-city">
                        <label for="state">State <span>*</span></label>

                        <div class="clg-input-box"><i class="fa-solid fa-map"></i>
                            <input type="text" id="state" name="state" placeholder="Enter state" required>
                        </div>

                    </div>

                    <!-- Postal Code -->
                    <div class="right-clg-form-group">
                        <label for="postalCode">Postal Code <span>*</span></label>

                        <div class="clg-input-box"><i class="fa-solid fa-location-pin"></i>
                            <input type="text" id="postalCode" name="postalCode" placeholder="Enter postal code" maxlength="10"
                            required>
                        </div>

                    </div>

                    <!-- Country -->
                    <div class="right-clg-form-group">
                        <label for="country">Country <span>*</span></label>

                        <div class="clg-input-box"><i class="fa-solid fa-globe"></i>
                            <select id="country"name="country" required>
                                <option value="">-- Select Country --</option>
                                <option value="India">India</option>
                            </select>
                        </div>

                    </div>

                </div>

            </div>


            <!-- EMPLOYMENT -->
            <div class="plac-right-form-section">

                <div class="plac-right-section-title"><i class="fa-solid fa-user-tie"></i>
                    <span>Employment Details</span>
                </div>

                <div class="plac-right-form-grid">

                    <div class="right-clg-form-group">
                        <label for="employeeStatus">Employee Status <span>*</span></label>

                        <div class="clg-input-box"><i class="fa-solid fa-id-badge"></i>
                            <select id="employeeStatus" name="employeeStatus" required>
                                <option value="">-- Select Employee Status --</option>
                                <option value="Fresher">Fresher</option>
                                <option value="Experienced">Experienced</option>
                                <option value="Currently Working">Currently Working</option>
                                <option value="Previously Worked">Previously Worked</option>
                            </select>
                        </div>

                    </div>

                </div>

            </div>


            <!-- RESUME -->
            <div class="plac-right-form-section">

                <div class="plac-right-section-title"><i class="fa-solid fa-file-pdf"></i>
                    <span>Resume</span>
                </div>

                <div class="right-clg-form-group right-clg-full-width">
                    <label for="resume">Upload Resume <span>*</span></label>

                    <div class="file-upload-box"><i class="fa-solid fa-cloud-arrow-up"></i>
                        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                        <p>Upload PDF, DOC or DOCX</p>
                        <small>Maximum file size: 5 MB</small>
                    </div>

                </div>

            </div>


            <!-- DECLARATION -->
            <div class="declaration">

                <label>
                    <input type="checkbox" id="declaration"required>
                    <span>
                        I hereby declare that the information provided
                        above is true and correct to the best of my knowledge.
                    </span>
                </label>

            </div>


            <!-- BUTTON -->
            <div class="pla-clg-form-actions">

                <button type="reset" class="pla-clg-reset-btn"><i class="fa-solid fa-rotate-left"></i>
                    Reset
                </button>

                <button type="submit" class="pla-clg-submit-btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i>
                    Submit Application
                </button>

            </div>


            <!-- Message -->
            <div id="formMessage"></div>

        </form>

    </div>

</div>

</div>




<!-- College Placement - JS -->
<script>

    const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxjnj7wBg06nsKpwOpFv6gne-_215FphaQSgDDWFRfc7IXaLr5ATNth4rqAC6TVcyh1/exec";


    /*--- GET HTML ELEMENTS ---*/
    const placementForm = document.getElementById("placementForm");

    const submitBtn = document.getElementById("submitBtn");

    const formMessage = document.getElementById("formMessage");

    const resumeInput = document.getElementById("resume");

    const mobileInput = document.getElementById("mobile");

    const postalCodeInput = document.getElementById("postalCode");

    const declaration = document.getElementById("declaration");


    /*--- RESUME VALIDATION ---*/
    resumeInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }


        /*--- Allowed MIME types ---*/
        const allowedTypes = [

            "application/pdf",
            "application/msword",
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

        ];


        /*--- Maximum 5 MB ---*/
        const maxSize = 5 * 1024 * 1024;


        /*--- Check file type ---*/
        if (!allowedTypes.includes(file.type)) {

            showMessage(
                "Please upload only PDF, DOC or DOCX files.",
                "error"
            );

            this.value = "";

            return;
        }


        /*--- Check file size ---*/
        if (file.size > maxSize) {

            showMessage(
                "Resume size must be less than 5 MB.",
                "error"
            );

            this.value = "";

            return;
        }


        /*--- Valid file ---*/
        formMessage.style.display = "none";

    });


    /*--- MOBILE NUMBER VALIDATION ---*/
    mobileInput.addEventListener("input", function () {

        /*--- Allow numbers only ---*/
        this.value = this.value.replace(/\D/g, "");


        /*--- Maximum 10 digits ---*/
        if (this.value.length > 10) {

            this.value = this.value.substring(0, 10);

        }

    });


    /*--- POSTAL CODE VALIDATION ---*/
    postalCodeInput.addEventListener("input", function () {

        /*--- Allow numbers only ---*/
        this.value = this.value.replace(/\D/g, "");


        /*--- Maximum 10 characters ---*/
        if (this.value.length > 10) {

            this.value = this.value.substring(0, 10);

        }

    });


    /*--- FORM SUBMIT ---*/
    placementForm.addEventListener("submit",
        async function (event) {

            event.preventDefault();


            /*--- Clear previous message ---*/
            formMessage.style.display = "none";
            formMessage.className = "";
            formMessage.textContent = "";


            /*--- CHECK MOBILE NUMBER ---*/
            const mobile = mobileInput.value.trim();

            if (mobile.length !== 10) {

                showMessage(
                    "Please enter a valid 10-digit mobile number.",
                    "error"
                );

                mobileInput.focus();

                return;
            }


            /*--- CHECK DECLARATION ---*/
            if (!declaration.checked) {

                showMessage(
                    "Please accept the declaration before submitting.",
                    "error"
                );

                declaration.focus();

                return;
            }


            /*--- CHECK RESUME ---*/
            const resumeFile = resumeInput.files[0];

            if (!resumeFile) {

                showMessage(
                    "Please upload your resume.",
                    "error"
                );

                resumeInput.focus();

                return;
            }


            /*--- CHECK RESUME SIZE ---*/
            const maxSize = 5 * 1024 * 1024;


            if (resumeFile.size > maxSize) {

                showMessage(
                    "Resume size must be less than 5 MB.",
                    "error"
                );

                resumeInput.value = "";

                return;
            }


            /*--- DISABLE SUBMIT BUTTON ---*/
            submitBtn.disabled = true;

            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';


            try {


                /*--- CONVERT RESUME TO BASE64 ---*/
                const base64Resume = await convertFileToBase64(resumeFile);


                /*--- COLLECT FORM DATA ---*/
                const formData = {

                    fullName:
                        document
                            .getElementById("fullName")
                            .value
                            .trim(),


                    email:
                        document
                            .getElementById("email")
                            .value
                            .trim(),


                    mobile:
                        document
                            .getElementById("mobile")
                            .value
                            .trim(),


                    posting:
                        document
                            .getElementById("posting")
                            .value,


                    address:
                        document
                            .getElementById("address")
                            .value
                            .trim(),


                    city:
                        document
                            .getElementById("city")
                            .value
                            .trim(),


                    state:
                        document
                            .getElementById("state")
                            .value
                            .trim(),


                    postalCode:
                        document
                            .getElementById("postalCode")
                            .value
                            .trim(),


                    country:
                        document
                            .getElementById("country")
                            .value,


                    employeeStatus:
                        document
                            .getElementById("employeeStatus")
                            .value,


                    /*--- RESUME DATA ---*/
                    resumeBase64: base64Resume,

                    resumeFileName: resumeFile.name,

                    resumeMimeType: resumeFile.type

                };


                /*--- DEBUG ---*/
                console.log(
                    "Placement Form Data:",
                    {
                        fullName: formData.fullName,
                        email: formData.email,
                        mobile: formData.mobile,
                        posting: formData.posting,
                        address: formData.address,
                        city: formData.city,
                        state: formData.state,
                        postalCode: formData.postalCode,
                        country: formData.country,
                        employeeStatus: formData.employeeStatus,
                        resumeFileName: formData.resumeFileName
                    }
                );


                /*--- SEND DATA TO GOOGLE APPS SCRIPT ---*/
                const response = await fetch(GOOGLE_SCRIPT_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "text/plain;charset=utf-8"
                            },

                            body:
                                JSON.stringify(formData)
                        }
                    );


                /*--- CHECK HTTP RESPONSE ---*/
                if (!response.ok) {

                    throw new Error(
                        "Server returned HTTP " +
                        response.status
                    );

                }


                /*--- READ GOOGLE APPS SCRIPT RESPONSE ---*/
                const result = await response.json();

                console.log(
                    "Google Apps Script Response:",
                    result
                );


                /*--- CHECK SUCCESS ---*/
                if (
                    result &&
                    result.status === "success"
                ) {


                /*--- Success message ---*/
                showMessage(
                    "Application submitted successfully!",
                    "success"
                );


                /*--- Reset form ---*/
                placementForm.reset();


                } else {


                /*--- Apps Script returned an error ---*/

                    throw new Error(
                        result.message ||
                        "Unable to save application."
                    );

                }


            } catch (error) {


                /*--- ERROR HANDLING ---*/

                console.error(
                    "Placement Form Submission Error:",
                    error
                );


                showMessage(
                    "Unable to submit the application. " +
                    "Please try again.",
                    "error"
                );

            }


            /*--- ENABLE SUBMIT BUTTON ---*/
            submitBtn.disabled = false;

            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Application';

        }
    );


    /*--- CONVERT FILE TO BASE64 ---*/
    function convertFileToBase64(file) {

        return new Promise(
            (resolve, reject) => {

                const reader = new FileReader();

                reader.onload =
                    function () {

                        try {

                            /*
                             * FileReader returns:
                             *
                             * data:application/pdf;base64,XXXXXX
                             *
                             * We only need the Base64 part.
                             */

                            const base64String = reader.result
                                    .split(",")[1];


                            if (!base64String) {

                                reject(
                                    new Error(
                                        "Unable to convert resume."
                                    )
                                );

                                return;
                            }


                            resolve(
                                base64String
                            );

                        } catch (error) {

                            reject(error);

                        }

                    };


                reader.onerror = function () {

                        reject(
                            new Error(
                                "Unable to read resume file."
                            )
                        );

                    };


                reader.readAsDataURL(file);

            }
        );

    }


    /*--- SHOW FORM MESSAGE ---*/
    function showMessage(message, type) {

        formMessage.textContent = message;

        formMessage.className = type;

        formMessage.style.display = "block";

        formMessage.scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }


    /*--- RESET BUTTON MESSAGE ---*/
    placementForm.addEventListener("reset",
        function () {

            setTimeout(
                function () {

                    formMessage.style.display = "none";

                    formMessage.className = "";

                    formMessage.textContent = "";

                },
                5000
            );

        }
    );

</script>


</body>
</html>
